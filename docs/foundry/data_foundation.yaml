      topics carrying a NaN score are both already on the exclusion list)."
    isite_decomposition: "isite_works(_xa), same-row twin, zero recomputation (same convention as
      thm_frontier_labs)"
    artifact_flag: "topic-level 811-registry flag (True iff the topic itself is on the exclusion
      list) -- the SAME meaning thm_frontier's own texture-row artifact_flag already carries, now
