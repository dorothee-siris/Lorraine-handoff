# Data foundation — rev 3.1 (Foundry pass 2, post-Wind-Tunnel absorb, 2026-08-15)
# CANONICAL machine half. Supersedes data_foundation_draft.yaml rev 2 AND this file's own rev 3
# (tunnel pass 2: 27 attacks — 15 CONFIRMED / 7 WEAK absorbed, 5 UNFOUNDED; CHALLENGE_MEMO_pass2.md).
# Reading guide + rationale: DATA_FOUNDATION.md rev 3.1 (same folder).
# Consumers: BUILD_PLAN.md streams W0b/W1/W2/W3/W4/W5/E1. When a table is BUILT, its entry moves to
# docs/data_contract.yaml via docs/contract_fragments/<producer>_<table>.yaml (BUILD_PLAN S13).
#
# Evidence base: reports/foundry_pass2_probes.py (F0) · reports/data/_f3_scratch/
# f3_hostile_recompute.py (tunnel recomputes incl. the dual-mode momentum diff) ·
# repaired reports/lab_momentum_frozen.py (F2) · inputs/overlays/* (F2+F2b, volume-verified).
#
# Conventions for ALL new tables:
#   - long/typed columns only — NO ':'/'|' blob encodings
#   - conf_state in {all, no_conf} on EVERY new aggregate (or explicit conf_exempt/conf columns
#     with reason)
#   - ARTIFACT-FLAG (R-A, tunnel-hardened): NO artifact_state key rows. Every measure column on a
#     work-grain aggregate is exactly ONE of:
#       (a) twinned: `_xa` variant (excl-artifact = primary-flagged works dropped, pipeline-computed);
#       (b) listed in artifact_invariant_columns with a reason (list/structural facts);
#       (c) covered by the table's artifact_exempt block (whole measure family inert under toggle —
#           MUST grey out with †-annotated header while toggle ON, and land in the export header's
#           deferred_twins list; tunnel #17).
#     Topic-grain tables: flagged rows carry artifact_flag AND surviving cells carry `_xa` count
#     twins (both §6.2 halves: row-drop + work-drop; tunnel #4). W1 ships the (a)/(b)/(c)
#     completeness check as CODE so this file cannot drift again (tunnel #2).
#   - MOMENTUM UNDER ARTIFACT TOGGLE (ruling, tunnel #3): the momentum family (classes, p, w1/w2,
#     arrows, deltas-classified) is artifact_exempt APP-WIDE — never recomputed under the artifact
#     lens; rendered greyed/inert with caption « momentum calculé sur le corpus entier » while ON.
#     Rationale: 4-variant momentum has no golden, multiplies frozen-definition surface for marginal
#     insight; a visibly-inert chip is honest, a silently-stale one is not. Momentum IS recomputed
#     per conf_state (frozen METHOD reapplied; median derived per variant — see ptn_mom_facts).
#     PLAN-SUPERSESSION NOTE (to re-confirm with user at close): §6.2 "work-grain aggregates drop
#     flagged works" holds everywhere EXCEPT the momentum family, which discloses instead.
#   - SHIPS-V2 SURFACES under artifact toggle (tunnel #5): the standard banner text would LIE there
#     (nothing filtered). They get a DISTINCT strip: « Le filtre « hors référentiel » s'applique aux
#     nouvelles vues ; cette page v2 affiche le corpus entier — lignes concernées marquées †. » and
#     every export header carries artifact_applied: yes|no. PLAN-SUPERSESSION NOTE (same mechanism).
#   - PERIMETER SELECTOR on panels WITHOUT subset rows — including NEW views' non-subset panels
#     (tunnel #6): explicit disclosure strip; never a silently unfiltered number. Matrix extension
#     (e.g. ptn_fields in_isite rows ≈ +2-4k) = costed workshop option, not built now.
#   - subset_id FK to dim_subsets, default 'all', ONLY per subset_row_matrix
#   - perimeter_id row policy (tunnel #21): thm_funding/thm_frontier = {all, in_isite};
#     thm_diversity = {all, in_isite} ∪ curated labs (structure_key, per plan T3 grain). Additions
#     follow the same declared-contract-change rule as subset_row_matrix.
#   - D53 NULL-never-0; snapshot_date everywhere; category/arrow dtypes on identity strings;
#     frozen-definition numbers are PIPELINE outputs (incl. I11 deltas — tunnel #11)
#
# ARTIFACT-FLAG source: inputs/manual/OA_bad_topics.xlsx (copy-in W1), "Filter out" -> 811 topics.
# Measured (F0-P4, tunnel-reproduced): primary 4,106 = 11.15% · any 7,616 = 20.68% · In_ISITE 6/22.
# France-baseline asymmetry DISCLOSED: no topic grain in France strata -> _xa recomputes UL side
# only; FWCI_FR reference strata artifact-invariant by construction; caveats in METHODES.

