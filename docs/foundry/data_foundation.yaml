tables:

  # ---------- shared dims ----------
  dim_corpus_facts:
    status: SHIPPED (W0) + W0b delta above
    grain: conf_state (2 rows) + scalar facts
    columns: [conf_state, corpus_works, corpus_works_xa, works_excluded_thin_stratum,
              works_excluded_thin_stratum_xa, works_with_indicators, works_with_indicators_xa,
              corpus_collaborative_works, corpus_collaborative_works_xa,
              ul_intl_share, ul_intl_share_xa, ul_company_share, ul_company_share_xa,
              france_intl_share, france_intl_works, france_total_works,
              momentum_recentring_median, raw_pull_works, snapshot_date]
    artifact_invariant_columns: "france_* (no topic grain in France scope — METHODES caveat);
                                 momentum_recentring_median (frozen disclosure value, 'all' row
                                 only); raw_pull_works (pass 6 — a pre-filter pull-count fact,
                                 identical both conf_state rows, not a corpus measure)"
  dim_subsets:
    status: BUILD (W1)
    grain: subset (tiny registry — conf/xa as COLUMNS, not rows; tunnel #14)
    rows: "4 active (all · in_isite · in_isite_award · reserved stubs) + stub rows per pending kind"
    columns: [subset_id, label_fr, label_en, kind, owner, source_file, vintage_date,
              n_works, n_works_noconf, n_works_xa, n_works_noconf_xa, defi_rollup,
              status{active|stub}, snapshot_date]
  work_subsets:
    status: BUILD (W1)
    grain: work x subset
    columns: [work_id, subset_id, evidence{doi_list|award|hal_code|orcid_roster}]
    invariants: ["in_isite rows == 1839", "in_isite_award rows == 808", "no orphan subset_id"]
  subset_works:                  # NEW (tunnel #8) — the subset-grain publications drill source
    status: BUILD (W1)
    grain: work x subset (metadata-bearing; ~2.7k rows now)
    columns: [subset_id, work_id, year, title, doi, type, is_conference, in_isite, artifact_flag]
    write_spec: "sorted by subset_id, rg=5000 (trivially 1 group at current size — invariant floor
                 n_rows/10000 still satisfied; revisit if programme corpora land)"
    lazy_load: "lib/lazy.py key subset_id; serves P-V4 award tile (32 works) + subset exports"
  dim_artifact_topics:
    status: BUILD (W1)
    grain: topic (811 rows)
    columns: [topic_id, topic_name, reason_label_fr, snapshot_date]

  # ---------- partner family ----------
  ptn_summary:
    status: BUILD (W2)
    grain: partner x conf_state x subset_id
    rows_measured: "12,570 partners; RAM sim at rev-3 shape 8.6 MB (tunnel #18) — float32 on
                    share/ratio columns at builder discretion; load-map eval measures post-build"
    eager_load: [V1, V2]
    columns:
      identity: [partner_id, display_name, country_code, type_openalex, consortium_member,
                 idset_tags, merged_from_ids, plumbing_guard_flag]
      volume:   [co_works_full, co_works_full_xa, co_works_fractional, co_works_intl,
                 share_ul, share_ul_xa, share_ul_direct, n_ul_labs, first_year, last_year]
      reciprocity: [partner_total_windowed, share_p, share_p_capped_flag]    # populated (all,all)
                                                                             # only, since 42b
                                                                             # (2026-08-17, pass-4)
      impact:   [fwci_fr_median, fwci_fr_median_xa, fwci_fr_mean, fwci_fr_mean_xa,
                 share_cited, share_cited_xa, works_with_indicators, works_with_indicators_xa]
      momentum: [mom_class, mom_category, mom_p_value, mom_w1_share, mom_w2_share,
                 mom_count_arrow, mom_eligible_flag]        # per conf_state; NO _xa (exempt ruling)
      isite:    [isite_co_works, isite_share]
    artifact_invariant_columns: "identity block (list/structural) · reciprocity (42b-gated,
      partner-side not artifact-filterable) · isite_* (list-based) · n_ul_labs/first_year/last_year
      (presence facts) · share_ul_direct/co_works_fractional/co_works_intl (DEFERRED twins —
      grey-out + deferred_twins export list, tunnel #17)"
    artifact_exempt_families: "momentum (app-wide ruling above)"
    invariants:
      - "DUAL-MODE momentum golden (tunnel #1, ENUMERATED): frozen-parity run == 682 -> 106/52/277/247,
         new 5/dormant 0, >=50: 215 -> 47/17/103/48 EXACT; shipped run == 681 -> 105/51/277/248,
         >=50: 214 -> 46/16/103/49 EXACT; machine-diff == {removed: Centre Inria de l'UL (down),
         flips: CHU de Reims I4210105796 up->ns} and NOTHING else. Any other diff fails the build —
         never weaken the blocklist to pass."
      - "class sums == eligible per (conf_state, floor); no_conf run derives ITS median per the
         frozen METHOD (recorded in ptn_mom_facts; measured value pinned at first build by E1)"
      - "blocklist absent / id-set partners present / no 'Deleted Institution' / successor merges
         folded back per overlay status==ok (3 pairs this pass; the plan's '23 dup ids' predates
         enumeration — remainder = overlay TODO catch-all, client/42b gate)"
      - "share_p AND baseline_partner_share NULL-never-0; populated ONLY on (conf_state='all',
         subset_id='all') rows for the ~3,616 + 3 merged-union partners in the 42b pulled set
         (2026-08-17, pass-4 G3), NULL on every no_conf/in_isite row and on any partner outside the
         pulled set — never 0 (D53)"
      - "isite reconciliation: isite_co_works(all-row) == co_works_full(in_isite-row) per partner"
