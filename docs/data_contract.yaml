      - {name: "parent_id",          dtype: string,  from: "bare id, matches thematic_overview.id"}
      - {name: "child_level",        dtype: string,  from: "level of the child", allowed: [field, subfield, topic]}
      - {name: "child_id",           dtype: string,  from: "bare id", note: "unreferenced by page 4 today but it is the FK Stream B/E recompute against — keep"}
      - {name: "child_name",         dtype: string,  from: "taxonomy name"}
      - {name: "pubs_total",         dtype: int64,   from: "count of works"}
      - {name: "pubs_pct_of_parent", dtype: float64, from: "pubs_total / parent pubs_total"}
      - {name: "pubs_per_year",      dtype: string,  from: "derived", format: "2019:120|2020:135|..."}
      - {name: "pct_isite",          dtype: float64, from: "In_ISITE share"}
