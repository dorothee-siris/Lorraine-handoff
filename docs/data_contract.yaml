  # 39. aut_impact_drill -- Stream W4 (45b_build_author_views.py), fragment merged by E1a 2026-08-15
  #     source fragment: docs/contract_fragments/45b_aut_impact_drill.yaml
  # ==========================================================================================
  aut_impact_drill.parquet:
    source: "ul_authors.parquet (person x work universe, via the exploded author_id->person_id
             mapping onto corpus_authorships) + corpus_metrics.parquet (FWCI_FR / PPtop10_FR /
             indicator_status per work)"
    build_step: "pipeline/45b_build_author_views.py"
    keys: [author_id, conf_state]
    read_by_app: true  # RA-C03 fix: flag was stale -- pages/10_Author_Profile.py's impact
                        # drill (_load_aut_impact_drill()) reads this file directly
    new_in_v2: true
    rows_measured: "960 (480 persons x 2 conf_state rows); 0.014 MB disk"
    row_grain: >
      Person x conf_state. THE ONLY table on the author family carrying an impact column -- the
      physical split from aut_public/aut_works IS safeguard 1 (a UI toggle cannot un-hide a column
      that lives in a different file). No-export by design (safeguard 3, S6.4 exceptions block):
      this table has no export path in code anywhere in this pipeline.
    population_note: >
      The eligibility gate (works_with_indicators >= config.workshop_tunables.author_impact_floor,
      30) is evaluated ONCE, on the ALL-corpus basis (matching F0-P3's exact golden: 480 persons,
      reproduced to the digit). BOTH conf_state rows describe the SAME 480 persons, re-scored under
      each lens -- re-gating the floor independently per conf_state was tried first and collapses the
      no_conf population to 282 (many LORIA/INRIA-heavy profiles lean on conference output for a
      material share of their indicator volume), which the W4 dispatch's own "480 per conf_state"
      framing rules out. A fixed subject pool, re-scored per lens, is also the only reading consistent
      with data_foundation.yaml's own artifact_exempt rationale for this table ("impact context
      computed on full corpus") -- read analogously here for the conference lens: the POOL is a
      full-corpus fact, only the displayed fwci_fr_mean/pptop10_count/works_with_indicators numbers
      move. A no_conf row's own works_with_indicators can (and does, for some persons) fall below 30;
      the row still appears, since the gate was never re-applied per conf_state.
    columns:
      - {name: "author_id", dtype: string, from: "ul_authors.person_id"}
      - {name: "conf_state", dtype: category, allowed: [all, no_conf]}
      - {name: "fwci_fr_mean", dtype: float64, nullable: true,
         from: "mean FWCI_FR over this person's works with indicator_status=='computed', restricted to
                non-conference works when conf_state=='no_conf'"}
      - {name: "pptop10_count", dtype: int32,
         from: "count of this person's indicator-computed works with PPtop10_FR==True, same
                conf_state restriction"}
      - {name: "works_with_indicators", dtype: int32,
         from: "count of this person's works with indicator_status=='computed', same conf_state
                restriction (can be < the 30-work floor under no_conf -- see population_note)"}
    invariants:
      - "(author_id, conf_state) unique; exactly 480 distinct author_id values, each appearing once
         per conf_state"
      - "conf_state=='all' row count EXACTLY 480 (F0-P3 golden, reproduced to the digit)"
      - "both conf_state row counts inside the 400-600 band"
      - "independent recompute of works_with_indicators (conf_state=='all') == ul_authors.works_with_indicators
         for all 12,680 persons -- 0 mismatches (the eligibility gate is built on this reconciled figure)"
      - "no export path exists anywhere in the built pipeline (S6.4 exception, unchanged by this build)"
    dropped_from_v1: []

  # ==========================================================================================
  # 40. aut_coverage -- Stream W4 (45b_build_author_views.py), fragment merged by E1a 2026-08-15
  #     source fragment: docs/contract_fragments/45b_aut_coverage.yaml
  # ==========================================================================================
  aut_coverage.parquet:
    source: "ul_authors.parquet (orcid/idhal presence, own_labs) + works_master.parquet
             (Labs/primary_field*/publication_year/hal_authors_idhal, the 'hal-link fields') +
             corpus_authorships.parquet (UL-side authorship rows, exploded to person_id) +
             ul_authors_review_queue.parquet + MANIFEST.json step 45_build_authors' own
             X_orcid_conflict_blocked count"
    build_step: "pipeline/45b_build_author_views.py"
    keys: [unit_kind, unit_id, conf_state]
    read_by_app: true  # RA-C03 fix: flag was stale -- pages/11_Identifiers_Coverage.py's
                        # _load_aut_coverage() reads this file directly
    new_in_v2: true
    rows_measured: "212 (68 lab + 27 field-incl-UNKNOWN... see breakdown below + 5 year + 6 population,
                    each x2 conf_state) -- 0.021 MB disk. Diverges from the YAML's own sizing comment
                    ('rows ~3,390 x2') because that figure describes an EARLIER (F0-P3, pass 2) full
                    lab x year x field CROSS grain prototype; the W4 dispatch's Build rules explicitly
                    supersede that with a STACKED UNION of four independent grains ('collective grains
                    ONLY: lab x year x field x population ROWS' -- read as a list of row kinds, not a
                    cross-product), which is also the only grain that has room for the identity-ledger
                    population rows (merged profiles / review queue / unresolved share) the dispatch
                    also requires -- those facts do not fit any (lab, year, field) tuple. Breakdown per
                    conf_state: 68 labs (67 curated + NO LAB, exploded from works_master.Labs -- a work
                    with 2-7 pipe-joined labs counts once per lab, F0-P3's own explode method reused
                    verbatim) + 27 fields (26 populated + 1 UNKNOWN bucket) + 5 years (2019-2023) + 6
                    population rows = 106; x2 conf_state = 212."
    row_grain: >
      unit_kind in {lab, field, year, population} x unit_id x conf_state. NEVER a per-person row
      (safeguard 5): the schema itself makes a lab-level ORCID league table unrepresentable, not just
      discouraged in the UI.
    unknown_vs_absent: >
      'NO LAB' (unit_kind='lab') is a DEFINED ABSENCE -- a work genuinely outside any curated lab,
      kept as its own explicit row, never dropped. unit_id='UNKNOWN' (unit_kind='field') is GENUINELY
      UNKNOWN -- the topic classifier assigned no primary field (51 works, 0.14% of the corpus) -- kept
      as its own explicit row with no person roster (field membership is undefined for these works).
      The two are deliberately distinguished in unknown_distinct_note per row, per the dispatch's
      explicit "unknown-vs-absent kept distinct" requirement.
    column_overloads: >
      Two deliberate, documented overloads of the fixed 13-column contract (both flagged per-row in
      unknown_distinct_note, since the declared columns have no dedicated slot for either concept):
      (1) unit_kind='year' rows use n_persons/n_persons_orcid/pct_orcid to carry UL-CREDITED
      AUTHORSHIP ROW counts and their ORCID share for that year (not distinct persons) -- this is
      indicator_plan_FINAL.md S5's "UL-side authorship ORCID share" figure (67.1/69.5/72.0/72.6/71.5%
      across 2019-23), which is row-grain by construction (the same person recurs across years, so
      only a row-level share captures the year-over-year identifier-uptake dynamic). n_works /
      n_works_orcid_author / pct_works_orcid on the SAME year rows stay work-grain ("share of that
      year's works with >=1 ORCID'd UL author"), giving both cuts on one row.
      (2) the three identity-ledger population rows (merged_profiles / review_queue /
      unresolved_share) repurpose n_persons and/or pct_orcid to carry raw counts and shares that are
      not person-coverage rates at all (a merged-profile count, a raw pair count, and a
      share-of-detected-conflicts figure respectively) -- see the population row list below.
    columns:
      - {name: "unit_kind", dtype: category, allowed: [lab, field, year, population]}
      - {name: "unit_id", dtype: string,
         from: "lab code (incl. 'NO LAB') | primary_field_id (incl. 'UNKNOWN') | 4-digit year string |
                one of {all_persons, persons_ge5works, all_works, merged_profiles, review_queue,
                unresolved_share}"}
      - {name: "unit_label", dtype: string, from: "human-readable label per unit_id (field_name for
         fields; the lab code itself for labs, no separate long name available; the year string
         itself; a hand-written sentence for population rows)"}
      - {name: "conf_state", dtype: category, allowed: [all, no_conf]}
      - {name: "n_persons", dtype: float64, nullable: true,
         from: "person-grain count -- see column_overloads for the year/population deviations. Person
                roster for lab = ul_authors.own_labs_joined exploded (this person's OWN UL-credited
                affiliation, conf_state-filtered on the underlying authorship rows -- NOT works_master's
                Labs column, which would mis-attribute co-authors of a multi-lab work to labs they are
                not personally affiliated with). Person roster for field = >=1 UL-credited work with
                that primary field, conf_state-filtered (a whole-work property, no equivalent
                mis-attribution risk)."}
      - {name: "n_persons_orcid", dtype: float64, nullable: true, from: "same roster, ORCID-non-null subset"}
      - {name: "pct_orcid", dtype: float64, nullable: true, from: "n_persons_orcid / n_persons (or a
         repurposed value -- see column_overloads); D53 null-never-0, never computed on a 0-person roster"}
      - {name: "n_works", dtype: float64, nullable: true, from: "ALL corpus works in this unit
         (conf_state-filtered), work-grain, independent of UL-crediting -- matches F0-P3's own method"}
      - {name: "n_works_orcid_author", dtype: float64, nullable: true,
         from: "of those, count with >=1 ORCID'd UL-side author (any authorship row on that work where
                institution is_ul==True and orcid is non-null)"}
      - {name: "pct_works_orcid", dtype: float64, nullable: true, from: "n_works_orcid_author / n_works"}
      - {name: "idhal_proxy_pct", dtype: float64, nullable: true,
         from: "share of this unit's works with a non-empty works_master.hal_authors_idhal -- a
                WORK-level proxy (corpus_authorships carries no per-author-row idHAL flag), same
                modelling choice F0-P3 already documented, not a gap"}
      - {name: "unknown_distinct_note", dtype: string, from: "per-row disclosure text -- documents the
         NO LAB/UNKNOWN distinction, the year/population column overloads, or a plain collective-grain
         statement"}
      - {name: "snapshot_date", dtype: string, from: "config.yaml project.snapshot_id"}
    population_rows: >
      all_persons (n_persons=12,680; conf_state-invariant) * persons_ge5works (floor reapplied to the
      conf_state-filtered n_works for no_conf, per S6.5) * all_works (work-grain; pct_works_orcid IS
      the "works with >=1 ORCID'd UL author" golden on conf_state=all) * merged_profiles (n_persons =
      count with ul_authors.n_profiles>1 = 1,043; pct_orcid repurposed = share of all persons) *
      review_queue (n_persons repurposed = raw pair count = len(ul_authors_review_queue) = 20) *
      unresolved_share (pct_orcid repurposed = 20 / MANIFEST's X_orcid_conflict_blocked (5,393) =
      the share of every detected ORCID conflict that reached human review rather than being silently
      dropped).
    invariants:
      - "(unit_kind, unit_id, conf_state) unique"
      - "GOLDEN (F0-P3/plan S5, conf_state=all, tolerance <0.05pt): all_works.pct_works_orcid == 72.6%;
         persons_ge5works.pct_orcid == 72.4%; all_persons.pct_orcid == 48.6%"
      - "GOLDEN by-year (year rows, pct_orcid, conf_state=all, tolerance <=0.15pt -- see report for
         the one explained 0.07pt rounding-boundary delta on 2022): 2019 67.1% / 2020 69.5% / 2021
         72.0% / 2022 72.6% / 2023 71.5%"
      - "2023 < 2022 on the by-year series (the dip is INTACT, never smoothed)"
      - "NO LAB and UNKNOWN rows present and never silently dropped"
    dropped_from_v1: []

  # ==========================================================================================
  # 41. bench_peers -- pass 4, Stream G4 (49_pull_peer_benchmark.py + 49b_build_peer_benchmark.py)
  #     T4b peer benchmark. Upgrades data_foundation.yaml's GATED-CLIENT stub to BUILD (G4),
  #     per user ruling 2026-08-17 (the 9 peers of docs/benchmark_peer_candidates.md Sec.3).
  # ==========================================================================================
  bench_peers.parquet:
    source: "pipeline/49_pull_peer_benchmark.py's 9 peer_works_<id>.parquet pulls (live OpenAlex,
             direct-id perimeter) + works_master.parquet (UL's own row, via_ul_direct & 5 types) +
             france_baseline_strata.parquet (the SAME France reference works_master's own FWCI_FR/
             PPtop10_FR were computed against, joined here via a verbatim copy of
             pipeline/31_build_baseline.py's stratum logic) + all_topics.parquet (domain/field/
             subfield names + the subfield->field->domain rollup)"
    build_step: "pipeline/49b_build_peer_benchmark.py"
    keys: [entity_id, node_level, node_id, conf_state]
    read_by_app: true
    read_by:
      - "Streamlit/pages/12_Benchmark.py (T4b dot-ratio per field, subfield drill, PPtop10_FR panel)"
    rows_expected: 5660
    new_in_v2: true
    row_grain: >
      entity_id (10 values: UL's own OpenAlex id + 9 peer OpenAlex ids) x node_level
      {all (1), domain (4), field (26), subfield (252) = 283 nodes} x conf_state {all, no_conf}.
      10 x 283 x 2 = 5,660 rows.
    why_deployed: >
      the T4b peer benchmark: per-field (and per-subfield, per-domain) activity Location Quotient
      vs France, and the SAME French-baselined FWCI_FR/PPtop10_FR indicators UL's own pages use,
      applied SYMMETRICALLY to 9 peer institutions pulled with an identical direct-id + 5-corpus-type
      recipe (docs/benchmark_peer_candidates.md Sec.5, "peers-symmetry rule"). UL's own row is a
      LOCAL recompute from works_master filtered to `via_ul_direct` & the 5 types -- the direct-id
      perimeter (measured 28,464), NOT the 36,819 lineage corpus (Sec.2a reconciliation: 28,464 here
      vs 28,485 live-API vs 36,819 canonical vs 28,094 v1 -- four different UL numbers, each with a
      distinct perimeter/filter, all four must be named together, never one picked silently).
    construction_note: >
      share_of_entity is computed over the entity's OWN topiced-works total (works with a primary
      subfield), not its grand total including untopiced works -- this is what lets shares sum to
      1.000 +/-0.001 across nodes at a level (builder-asserted); the untopiced remainder is
      disclosed separately (builder print + MANIFEST.json), never folded into the share silently.
      lq_vs_france = (entity's node share, topiced-total basis) / (France's node share, topiced-total
      basis, SAME conf_state) -- NULL (never 0/inf, D53) when either side's node/total is 0. France's
      reference (fr_subfield/fr_field/fr_domain/fr_total) is a FIXED external population built ONCE
      from france_baseline_strata and reused unchanged for all 10 entities -- generalises
      thm_specialisation's field/subfield-only construction to the full {all, domain, field,
      subfield} grain this table needs. FWCI_FR/PPtop10_FR per work: `usable_indicators()` in
      49b_build_peer_benchmark.py is a VERBATIM copy of 31_build_baseline.py's join ("usable =
      n>=30(non-thin) & mean_citations>0" for FWCI_FR; PPtop10_FR = tie-aware `>=` against the
      STORED p90 threshold, D40 percentile-rank definition) -- never reimplemented, proven by the
      build-time golden: 500 randomly sampled (seed 42) UL works recomputed through this exact
      function reproduce works_master's own stored FWCI_FR/PPtop10_FR EXACTLY (challenge memo
      lens #14). fwci_fr_mean/fwci_fr_median/pptop10_fr_share are NULL (D53) whenever
      works_with_indicators < config.metrics.min_stratum_n (30) for that cell.
    honesty_disclosures: >
      (1) FR-vs-foreign direct-id asymmetry (docs/benchmark_peer_candidates.md Sec.2b): French
      peers' direct-id counts run 1.29-2.18x below their own lineage figure (co-tutelle UMR
      grafting), foreign peers ~1.00-1.08x -- an asymmetric ~25-35% error bar on any FR-vs-foreign
      size comparison, carried onto the page's method strip, never silently equalised.
      (2) FWCI_FR applied to foreign peers is a FIXED COMMON YARDSTICK (the French national
      reference), not a claim that French norms are a "world" standard -- stated explicitly, every
      time the number appears.
      (3) Component-ecole exclusions (Sec.2c, `inputs/overlays/bench_peers.csv` note column):
      Nantes excludes Centrale Nantes, UGA/Grenoble Alpes excludes Grenoble INP -- both peers'
      eng-mat share reads UNDERSTATED relative to UL, whose own direct id INCLUDES its INP schools
      (direction-of-bias, lens #16) -- one sentence on the page, not just in this contract.
      (4) live-drift band: per-peer pulled totals vs the frozen G8 CSV (probed 2026-08-17,
      `reports/data/peer_candidate_probes.csv`) checked at +/-3% (calibration measured Tampere at
      -0.02%); the band checks MAGNITUDE, not recipe correctness -- the filter string itself is
      reviewed in `pipeline/49_pull_peer_benchmark.py`'s own docstring (lens #15).
      (5) the ~0.1% UL-row filter-asymmetry: works_master already applies corpus-only filters
      (missing-title drop, D34 truncation repair) that a live peer pull does not go through --
      measured <=0.1% (28,464 here vs 28,485 on a fresh live count), immaterial but disclosed
      (lens #12).
      (6) per-peer works_with_indicators/works coverage is measured and printed at build time
      (lens #13); any entity below ~95% is disclosed on the page.
    artifact_exempt: "S9: peer corpora are pulled live from OpenAlex, not the frozen local
      artifact-flagged snapshot -- there is no way to know which of a peer's works sit on one of
      the 811 excluded topics. This table is EXEMPT BY CONSTRUCTION from the artifact toggle (no
      _xa columns anywhere), the same disclosed asymmetry 42b's reciprocity denominators already
      carry. The page shows the standard exemption strip, never the toggle behaviour."
    columns:
      - {name: "entity_id", dtype: string, from: "OpenAlex institution id for every row, UL
         included (config.perimeter.ul_openalex_id) -- one uniform id space, no synthetic sentinel"}
      - {name: "entity_name", dtype: string, from: "bench_peers.csv display_name (peers) or
         'Universite de Lorraine' (UL)"}
      - {name: "rung", dtype: string, allowed: [FOCAL, FR-ISITE, FR-IDEX, XBORDER, EU-MIRROR],
         from: "bench_peers.csv rung column ('FOCAL' hardcoded for the UL row)"}
      - {name: "country", dtype: string, from: "bench_peers.csv country column ('FR' for UL)"}
      - {name: "node_level", dtype: string, allowed: [all, domain, field, subfield]}
      - {name: "node_id", dtype: string, from: "'all' sentinel | all_topics.domain_id (4) |
         .field_id (26) | .subfield_id (252), bare string ids"}
      - {name: "node_name", dtype: string, from: "'All fields' (level=all) | all_topics.
         {domain,field,subfield}_name"}
      - {name: "conf_state", dtype: string, allowed: [all, no_conf]}
      - {name: "works", dtype: int64, from: "level=all: entity's RAW filtered total (incl.
         untopiced works); level=domain/field/subfield: count of the entity's TOPICED works at
         that node"}
      - {name: "share_of_entity", dtype: float64, nullable: true, from: "works / entity's own
         topiced-works total for that conf_state (level=all: always 1.0); NULL never applies at
         level=all, may be NaN at deeper levels only if the entity has zero topiced works entirely"}
      - {name: "lq_vs_france", dtype: float64, nullable: true, from: "(entity node share) /
         (France node share), topiced-total basis both sides, SAME conf_state; NULL (never 0/inf)
         when either side's node or total is 0; level=all: always 1.0 by construction (trivial)"}
      - {name: "fwci_fr_mean", dtype: float64, nullable: true, from: "mean FWCI_FR over this
         cell's works_with_indicators; NULL (D53) if works_with_indicators < 30"}
      - {name: "fwci_fr_median", dtype: float64, nullable: true, from: "median FWCI_FR, same floor"}
      - {name: "pptop10_fr_share", dtype: float64, nullable: true, from: "share of works_with_
         indicators with PPtop10_FR==True, same floor"}
      - {name: "works_with_indicators", dtype: int64, from: "count of this cell's works with a
         non-null FWCI_FR (i.e. landed in a usable, non-thin France stratum)"}
      - {name: "snapshot_date", dtype: string, from: "config.yaml project.snapshot_id"}
      - name: "peer_pull_date"
        dtype: string
        nullable: true
        new_in_v2: true
        why: "pass 6, S-NC cross-stream request (NARRATIVE_CONTRACT_pass6.md sec.5): page 14
