      - "pages/4_*.py L73 + get_research_topic_keywords(): only reachable when level == 'research_topic', which D9 deletes from the selector"
    grep_obligation:
      command: 'grep -rEc "Classic TM|Research Topic|Objective [123]|Method [123]|Impact [123]|TM_labels" Streamlit/'
      expected: 0
      owner: "Stream C"
      note: >
        Currently NON-ZERO by design (Streamlit/ is the untouched v1 copy). This contract declares
        the file dead; Stream C's acceptance criterion is the grep returning 0. Blocks: the page-3
