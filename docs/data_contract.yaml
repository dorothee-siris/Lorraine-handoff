    row_grain: >
      Person (author_id == ul_authors.person_id) x work: EVERY corpus work that person's OpenAlex
      profile(s) are credited author on -- see the DESIGN NOTE below on why this is the ALL-corpus
      set, not the UL-credited-only subset the YAML's one-line grain label ("UL-credited authorship
      pairs") suggests in isolation. PHYSICALLY carries no fwci/pptop/impact/citation column
      (tunnel #16 / S6.4-3bis structural safeguard 3): an author-scoped export from this table cannot
      rebuild a withheld per-author FWCI via one AVERAGEIF, because the number simply is not here.
    design_note_grain: >
      The YAML's grain label and its own invariant text point in different directions if read as
      both being about the SAME filter: "UL-credited authorship pairs" (label) vs "pairs reconcile
      with aut_public.n_works per author" (invariant, quoted verbatim in the W4 dispatch). n_works is
      the ALL-corpus appearance count (ul_authors.n_works: a person's total corpus footprint, e.g.
      Silvio Danese 281 works, only 1 UL-credited -- D42), strictly larger than ul_credited_works in
      general. This builder honours the INVARIANT TEXT (the harder, testable spec, and the more
      useful reading for an A-V2 profile page's "works list") over the label's adjective: every row
      here is a work in the person's full Lorraine-corpus footprint, not filtered to rows where that
      specific work also happens to be UL-credited. `ul_credited_works` survives unfiltered on
      aut_public (a credit fact, safeguard-exempt) so any consumer can still see how much of the
      listed footprint was actually this person's own Lorraine affiliation. Flagged for E1/Studio to
