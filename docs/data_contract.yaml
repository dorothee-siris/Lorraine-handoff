# data_contract.yaml — Lorraine Explorer v2
#
# THE contract for every file `pipeline/60_deploy.py` writes into `Streamlit/data/`.
# Machine-readable on purpose: 60_deploy validates the built tables against this file and
# FAILS on any undeclared drop. v1's deploy silently dropped `Is_abstract` and broke Focus
# ISITE downstream; this file exists so that cannot happen twice.
#
# Human preamble, method and open risks: docs/DATA_CONTRACT.md
# Coverage proof:                        python docs/contract_coverage_check.py
#
# Every schema below was derived from the code that CONSUMES it (Streamlit/ = byte-identical
# v1 copy) and from v1's actually-deployed parquets (../Phase 1/Streamlit/data/), never guessed.
#
# Conventions
#   source        : v2 snapshot table (or frozen input) the file is built from
#   build_step    : the pipeline script that must produce it
#   keys          : primary key (uniqueness is a Class-1 invariant)
#   read_by_app   : true if v1/v2 page or lib code reads the file. false = deployed dataset,
#                   no view (D54/D55) — the coverage check is whole-table for these.
#   columns[].from: v2 source column or derivation. `from_v1` records the v1 column it replaces.
#   column_families: name-templated column groups (one per OpenAlex field). Validated as
#                   "exactly `count` columns fullmatch `pattern`" — no name expansion needed.
#   dropped_from_v1: EVERY v1 column that does not survive, with a reason. Non-negotiable.
#                   `pending_removal: true` = v1 code still references it; Stream C must delete
#                   the reference (grep obligation recorded in `grep_obligations`).

contract_version: "2.0"
snapshot_id: "2026-08-11"
written: "2026-08-11"
written_by: "Stream A (app-sprint)"
deploy_target: "Streamlit/data"
v1_reference: "../Phase 1/Streamlit/data"

policy:
  # 60_deploy MUST implement these. They are the whole point of the contract.
  fail_on_undeclared_drop: true       # a v1 column absent from `columns` and from `dropped_from_v1`
  fail_on_missing_column: true        # a declared column absent from the built table
  fail_on_extra_column: false         # extra columns are logged, not fatal (v2 tables are wider)
  fail_on_dtype_mismatch: true
  fail_on_key_duplication: true
  log_every_dropped_column: true      # the deploy log must print each drop + reason
  # Blob-encoded columns (`a:b:c|a:b:c`) are parsed by the app with str.split(":") / split("|").
  # Any field value that can contain ':' or '|' MUST be sanitised by the builder — see
  # invariants.blob_separator_safety. Real hazard: 8 of the 21 D56 hors-liste structures have a
  # colon in their display name ("CAPSID: Computational Algorithms...").
  blob_field_separator: ":"
  blob_item_separator: "|"
  blob_sanitise: "replace ':' and '|' in any field value with ' ' before joining"

files:

  # ==========================================================================================
  # 1. TAXONOMY DICTIONARY — the positional decoder for every subfield blob
  # ==========================================================================================
  all_topics.parquet:
    source: "snapshot tables/all_topics.parquet, pulled fresh by pipeline/12b_pull_taxonomy.py"
    build_step: "pipeline/12b_pull_taxonomy.py (pull) + pipeline/60_deploy.py (verbatim copy)"
    keys: [topic_id]
    read_by_app: true
    read_by: ["lib/data_cache.py:get_topics_df", "lib/helpers.py (all taxonomy lookups)"]
    rows_expected: 4516
    contract_correction: >
      STREAM B CORRECTION (unambiguous, flagged per BUILD_PLAN instructions): Stream A's draft
      named `inputs/manual/all_topics.parquet` (freezing v1's file) as the source, per its Open
      risk 2. The orchestrator's D59 ruling (BUILD_PLAN §7) supersedes that plan: a frozen third
      manual file breaks the "only two manual inputs" claim, so Stream B built
      `pipeline/12b_pull_taxonomy.py` instead — a complete pull of OpenAlex's `/topics` list
      endpoint (each topic record carries its own subfield/field/domain, so one endpoint suffices;
      no separate /domains + /fields + /subfields calls needed). Calibrated 1 page -> projected
      23 calls; full pull actually used exactly 23 calls, ~$0.002, 4,516 topics / 4 domains / 26
      fields / 252 subfields — matches rows_expected exactly. Archived to
      snapshot/raw/topics.jsonl.zst. Verified 2026-08-11 against works_master: 0 unknown topic,
      subfield, field or domain ids (taxonomy_is_superset holds).
    why_not_derived: >
      This is a DICTIONARY, not an aggregate. lib/helpers.get_subfields_for_field() returns
      sorted(subfields of a field) and every `Pubs per subfield within "X" (id: N)` blob in
      ul_labs is decoded POSITIONALLY against that list. Deriving the dictionary from the corpus
      would silently shorten the list for any field whose subfields are not all represented,
      shifting every value after the gap — the exact indexed-field misalignment class that bit
      v1 on 51.4% of works. A fresh /topics pull (this file's build_step) is complete by
      construction, so the freeze-vs-derive tension in Stream A's Open risk 2 is moot.
    upgrade_path: >
      Re-run pipeline/12b_pull_taxonomy.py per snapshot (already the default — it is a normal
      pipeline step, not a one-off). Invariant taxonomy_is_superset catches any drift.
    columns:
      - {name: "domain_id",     dtype: int64,  from: "domain_id"}
      - {name: "domain_name",   dtype: string, from: "domain_name"}
      - {name: "field_id",      dtype: int64,  from: "field_id"}
      - {name: "field_name",    dtype: string, from: "field_name"}
      - {name: "subfield_id",   dtype: int64,  from: "subfield_id"}
      - {name: "subfield_name", dtype: string, from: "subfield_name"}
      - {name: "topic_id",      dtype: string, from: "topic_id"}
      - {name: "topic_name",    dtype: string, from: "topic_name"}
      - {name: "keywords",      dtype: string, from: "keywords"}
    dropped_from_v1: []

  # ==========================================================================================
  # 2. ul_labs — page 1 in full. v1's WIDE shape is preserved deliberately.
  # ==========================================================================================
  ul_labs.parquet:
    source: "ul_labs_wide.parquet (NOT ul_labs.parquet) + works_master.parquet + corpus_authorships.parquet + ul_descendants.parquet"
    build_step: "pipeline/43_build_labs.py (modified: emits the v1 wide shape + D56 rows into tables/ul_labs_wide.parquet)"
    contract_correction: >
      STREAM B CORRECTION (unambiguous, flagged per BUILD_PLAN instructions): the original plan had
      43_build_labs.py write the deployed wide shape directly to tables/ul_labs.parquet. But
      tests/test_invariants.py (FROZEN, never edited) reads tables/ul_labs.parquet expecting the
      pre-app-sprint NARROW shape (a `lab` column, no D56/D60 rows) -- e.g.
      test_lab_table_has_a_row_for_every_listed_lab. The two requirements collide on one filename.
      Resolution: 43_build_labs.py now writes the unchanged narrow table to tables/ul_labs.parquet
      (keeps every frozen test green) and the new 116-column D56+D60 shape to a DIFFERENT snapshot
      table, tables/ul_labs_wide.parquet. 60_deploy.py sources the DEPLOYED Streamlit/data/ul_labs.parquet
      from ul_labs_wide.parquet (SOURCE_TABLE_OVERRIDE), not from the narrow tables/ul_labs.parquet.
    keys: [structure_key]
    read_by_app: true
    read_by: ["pages/1_*.py:get_all_structures_df", "lib/data_cache.py:get_labs_df/load_lab_info"]
    rows_expected: 100           # 69 curated (incl. NO LAB) + 21 hors-liste (D56) + 10 pole rows
    pole_rows_required: >
      v1's ul_labs carried 80 rows including 10 of Structure type == "department" (A2F, AM2I, BMS,
      CLCS, CPM, EMPP, LLECT, M4, OTELo, SJPEG) - the UL poles as selectable structures. v2's
      snapshot ul_labs has none, so without them page 1's structure-type filter loses a whole type
      and the overview table loses 10 rows: a visible parity regression (D49). The builder must
      emit them by grouping works_master on `Poles` (same aggregation, different key), with
      in_client_list = true. As in v1 they overlap the lab rows, so the structure table's column
      does not sum to the corpus - that is v1 behaviour and parity, not a bug.
    isite_pseudo_structure_removed: >
      v1 also carried a pseudo-structure `ror_isite` / "ISITE" of type experimental (its 2nd
      experimental row). v2 does not: ISITE is a per-work flag (In_ISITE, 1,839 works), and listing it
      as a structure double-counted those works into the structure table and into every top_labs
      blob. Deliberate deviation from v1, to be named in the shift report.
    shape_note: >
      v2's snapshot `ul_labs` is 69 x 25 long-ish; the DEPLOYED file must be v1's 126-column wide
      shape because page 1 reads it by literal name AND by regex over per-field column families.
      Reshaping it would mean rewriting all of page 1 for no user-visible gain (D49 parity).
    d56: >
      21 extra rows from ul_descendants where in_client_list == false, flagged by the new
      `in_client_list` column. 7 of the 21 have corpus works (690, 421, 111, 27, 22, 18, 12).
      The canonical NO LAB definition is UNCHANGED (works with no *curated* lab) = 4,568 works:
      hors-liste structures must NOT be subtracted from NO LAB, or every parity number moves.
    columns:
      # --- identity -------------------------------------------------------------------------
      - {name: "structure_key",   dtype: string, from: "'ROR:' + ror",     from_v1: "structure_key"}
      - {name: "Structure name",  dtype: string, from: "lab",              from_v1: "Structure name"}
      - {name: "Structure type",  dtype: string, from: "type",             from_v1: "Structure type",
         allowed: [lab, other, experimental, department]}
      - {name: "Pole",            dtype: string, from: "pole",             from_v1: "Pole", nullable: true}
      - {name: "ROR",             dtype: string, from: "ror",              from_v1: "ROR"}
      - {name: "OpenAlex ID",     dtype: string, from: "openalex_id",      from_v1: "OpenAlex ID", nullable: true}
      # --- NEW in v2 ------------------------------------------------------------------------
      - {name: "in_client_list",  dtype: bool,   from: "ul_descendants.in_client_list", new_in_v2: true,
         why: "D56 - the app flags hors-liste structures and excludes them from aggregates by default"}
      - {name: "Works excluded (thin stratum)", dtype: float64, from: "count(indicator_status != 'computed')",
         new_in_v2: true, nullable: true,
         why: "D53 - per-structure count behind the 'N works excluded: strate insuffisante' disclosure"}
      # --- volumes --------------------------------------------------------------------------
      - {name: "Pubs total",              dtype: int64,  from: "works",   from_v1: "Pubs total"}
      - {name: "Pubs per year",           dtype: string, from: "derived", from_v1: "Pubs per year",
         format: "2019:585|2020:627|..."}
      - {name: "Pubs per domain",         dtype: string, from: "derived", from_v1: "Pubs per domain",
         format: "positional, domain ids 1-4: '70 | 198 | 8 | 286'"}
      - {name: "Pubs per year per domain", dtype: string, from: "derived", from_v1: "Pubs per year per domain",
         format: "2019 (14 ; 19 ; 0 ; 68) | 2020 (...)"}
      - {name: "Pubs per field",          dtype: string, from: "derived", from_v1: "Pubs per field",
         format: "positional, field ids 11-36, 26 values"}
      - {name: "ISITE pubs per field",    dtype: string, from: "derived", from_v1: "ISITE pubs per field",
         format: "positional, field ids 11-36, 26 values"}
      - name: "Pubs per type (articles | book chapters | books | reviews | preprints)"
        dtype: string
        from: "derived"
        from_v1: "same"
        format: "6 positional values in v2: '460 | 57 | 3 | 33 | 9 | 120'"
        d52_note: >
          v2 adds conference papers (D36/D52). The 5 v1 slots cannot hold a 6th type, and page 1's
          parse_doctype_blob() hard-codes the 5 labels. Stream C MUST extend both the blob and the
          label list to 6 (articles | book chapters | books | reviews | preprints | conference
          papers); the builder emits 6 values. Declared here so the extension is contractual, not
          discovered at render time.
      # --- headline counters (v1 dtypes preserved: nullable float, page 1 uses safe_int) -----
      - {name: "Pubs with company",       dtype: float64, from: "derived", from_v1: "same", nullable: true}
      - {name: "Pubs international",      dtype: float64, from: "derived", from_v1: "same", nullable: true}
      - {name: "Pubs PPtop10% (subfield)", dtype: float64, from: "PPtop10_FR count", from_v1: "same", nullable: true,
         d40_note: "percentile-RANK definition on the subfield x year x type stratum, not an interpolated >= p90"}
      - {name: "Pubs PPtop1% (subfield)", dtype: float64, from: "PPtop1_FR count", from_v1: "same", nullable: true}
      - {name: "Pubs ISITE (In_ISITE)",   dtype: float64, from: "In_ISITE count", from_v1: "Pubs ISITE (In_LUE)", nullable: true}
      # --- FWCI -----------------------------------------------------------------------------
      - {name: "FWCI boxplot per field id (centiles 0,10,25,50,75,90,100)", dtype: string,
         from: "derived from works_master.FWCI_FR", from_v1: "same",
         format: "11 (0.00 ; 0.10 ; 0.32 ; 0.92 ; 1.44 ; 5.40 ; 12.5) | 12 (...)"}
      # --- collaborations -------------------------------------------------------------------
      - {name: "Top 10 internal lab/other collabs (type,count,ratio,FWCI)", dtype: string,
         from: "corpus_authorships", from_v1: "same",
         format: "Name (lab|other, count ; ratio ; fwci) | ..."}
      - {name: "Top 10 int partners (name)",    dtype: string, from: "ul_partners", from_v1: "same"}
      - {name: "Top 10 int partners (type)",    dtype: string, from: "ul_partners.sector", from_v1: "same"}
      - {name: "Top 10 int partners (country)", dtype: string, from: "ul_partners.country", from_v1: "same"}
      - {name: "Top 10 int partners (copubs with structure)", dtype: string, from: "derived", from_v1: "same"}
      - {name: "Top 10 int partners (% of all UL copubs with this partner)", dtype: string, from: "derived", from_v1: "same"}
      - name: "Top 10 int partners (FWCI)"
        dtype: string
        from: "derived"
        new_in_v2: true
        why: >
          v1 DEFECT FIX. pages/1_*.py line 337 reads this column and v1 never shipped it, so the
          'Avg FWCI' column of the international-partners table rendered permanently blank. Same
          for the FR table below. Adding it costs one groupby.
      - {name: "Top 10 FR partners (name)",     dtype: string, from: "ul_partners", from_v1: "same"}
      - {name: "Top 10 FR partners (type)",     dtype: string, from: "ul_partners.sector", from_v1: "same"}
      - {name: "Top 10 FR partners (copubs with lab)", dtype: string, from: "derived", from_v1: "same"}
      - {name: "Top 10 FR partners (% of all UL copubs with this partner)", dtype: string, from: "derived", from_v1: "same"}
      - {name: "Top 10 FR partners (FWCI)",     dtype: string, from: "derived", new_in_v2: true,
         why: "v1 defect fix, see 'Top 10 int partners (FWCI)'"}
      # --- authors --------------------------------------------------------------------------
      - {name: "Top 10 authors (name)",  dtype: string, from: "ul_authors.display_name", from_v1: "same"}
      - {name: "Top 10 authors (pubs)",  dtype: string, from: "derived", from_v1: "same"}
      - {name: "Top 10 authors (Average FWCI_FR)", dtype: string, from: "ul_authors.FWCI_FR_mean", from_v1: "same"}
      - {name: "Top 10 authors (Is Lorraine)", dtype: string, from: "derived", from_v1: "same",
         format: "pipe-separated 'True | False | ...'"}
      - {name: "Top 10 authors (Other internal affiliation(s))", dtype: string,
         from: "ul_authors.labs_joined", from_v1: "same", format: "';'-separated inside each slot"}
      - name: "nom_complet"
        dtype: string
        nullable: true
        new_in_v2: true
        why: "pass 6, P7 (#3/#28): full lab name for the manual source file + the lab mini-fiche
              identity block. Fill order (pipeline/43a_lab_identity.py, propagated by
              pipeline/43_build_labs.py): client Identifiants xlsx (acronym only, not a source for
              this column) -> HAL structure harvest cache (always empty today, see 43a's docstring)
              -> ROR API lookup by the lab's ROR id (68/70 client-list rows resolved) -> BLANK,
              never invented. Pole (D60) and hors-liste (D56) rows have no manual-list entry, so
              they stay NULL here -- there is no client-provided name to look up."
      - name: "nom_source"
        dtype: string
        nullable: true
        new_in_v2: true
        allowed: [client, hal, ror, blank]
        why: "P7 provenance flag for nom_complet -- 'ror' for the 68 ROR-resolved rows, 'blank' for
              the 2 pseudo-rows with no real ROR id (ISITE, NO LAB), NULL for pole/hors-liste rows
              (no attempt made, not the same as a failed lookup)"
    column_families:
      - name: pubs_per_subfield
        pattern: 'Pubs per subfield within .+ \(id: \d+\)'
        count: 26
        dtype: string
        from: "derived from works_master.primary_subfield_id"
        consumed_by: "pages/1_*.py:build_subfield_wordcloud_data / build_subfield_table (regex match)"
        format: "positional over sorted(all_topics.subfield_id where field_id == N)"
      - name: ratio_vs_ul_per_subfield
        pattern: 'Ratio against UL.+\(id: \d+\)'
        count: 26
        dtype: string
        from: "derived"
        consumed_by: "pages/1_*.py:build_subfield_table (regex match)"
        format: "positional, same order as pubs_per_subfield"
      - name: fwci_per_subfield
        pattern: 'FWCI per subfield within .+ \(id: \d+\)'
        count: 26
        dtype: string
        from: "derived from works_master.FWCI_FR"
        consumed_by: "pages/1_*.py:build_subfield_table (regex match)"
        format: "positional, same order as pubs_per_subfield"
    dropped_from_v1:
      - {name: "OpenAlex_lineage", reason: "unreferenced by any page; v2 records provenance per work instead (via_lineage / via_ul_direct / via_lab_ror on ul_pubs)"}
      - {name: "ISITE pubs per domain", reason: "unreferenced; page 1 plots the ISITE overlay per FIELD only ('ISITE pubs per field')"}
      - {name: "FWCI per domain", reason: "unreferenced; page 1 shows FWCI per field (boxplot) and per subfield (table)"}
      - {name: "FWCI per field", reason: "unreferenced; superseded by the per-field boxplot column, which page 1 does read"}
      - {name: "FWCI boxplot per domain id (centiles 0,10,25,50,75,90,100)", reason: "unreferenced; page 1 draws the whisker plot per field only"}
      - {name: "Internal department collabs (count,ratio,FWCI)", reason: "unreferenced; page 1 shows internal collabs per structure, not per pole"}
      - {name: "Pubs breakdown per SDG", reason: "unreferenced; a fixed per-structure SDG blob would hard-code one SDG variant, which D51 forbids (the variant is a config switch reading sdg_three_way)"}
      - {name: "Pubs breakdown per topic id (Classic TM)", reason: "D9 - topic model removed", pending_removal: false}
      - {name: "Pubs breakdown per topic id (Research Topics)", reason: "D9 - topic model removed"}
      - {name: "Pubs breakdown per topic id (Objectives)", reason: "D9 - the Objective axes never became interpretable; that is why Phase 2 exists"}
      - {name: "Pubs breakdown per topic id (Methods)", reason: "D9 - see Objectives"}
      - {name: "Pubs breakdown per topic id (Impacts)", reason: "D9 - see Objectives"}
      - {name: "Top 10 authors (Orcid)", reason: "unreferenced by page 1's build_authors_table; ORCIDs reach the app through thematic_detail_authors, and v1's values were polluted by the indexed-field misalignment"}
      - {name: "Top 10 authors (ID)", reason: "unreferenced; no author view (D54), so a per-lab author id list has no consumer"}

  # ==========================================================================================
  # 3. thematic_overview — pages 3 and 4
  # ==========================================================================================
  thematic_overview.parquet:
    source: "ul_thematic_overview.parquet + ul_thematic_by_year.parquet + works_master.parquet"
    build_step: "pipeline/44_build_thematic.py (extended to emit the v1 deploy shape)"
    keys: [level, id]
    read_by_app: true
    read_by: ["pages/3_*.py:load_thematic_overview", "pages/4_*.py (via lib/data_cache)"]
    rows_expected: 3553          # 5 domains + 27 fields + 246 subfields + 3275 topics
    contract_correction: >
      STREAM B CORRECTION (unambiguous, flagged per BUILD_PLAN instructions): Stream A's draft
      counted 239 subfields, taken from the pre-existing NAME-keyed `ul_thematic_overview` (which
      groups on `primary_subfield_name`). Building the id-keyed deployed shape directly from
      `works_master.primary_subfield_id` (as this contract's own `shape_note` below requires)
      surfaced 7 OpenAlex subfield NAMES that are shared by two DIFFERENT subfield ids in
      different fields (e.g. "Genetics" exists as both subfield 1311 under field 13
      "Biochemistry, Genetics and Molecular Biology" AND subfield 2716 under field 27 "Medicine";
      also: Archeology, Biochemistry, Industrial and Manufacturing Engineering, Neurology,
      Pharmacology, Physiology). Grouping by name instead of id would silently MERGE two unrelated
      subfields' works into one row -- the exact misattribution class the contract exists to
      prevent elsewhere (D34-class). Corrected count verified 2026-08-11 against `all_topics`.
    row_grain: "one row per (level, entity)"
    levels: [domain, field, subfield, topic]
    shape_note: >
      v2's snapshot table keys on (level, entity=NAME); the deployed file must key on
      (level, id) with `name`, `parent_id`, `parent_name`, `domain_id` because pages 3 and 4
      cast ids to int, map them through the taxonomy, and build the parent chain from them.
      The builder must therefore resolve names back to OpenAlex ids.
    unclassified_entity:
      what: "ul_thematic_overview carries a 5th domain-level entity '(sans thematique)' for the 51 untopiced works (0.1%)"
      required: 'id: "0", name: "Unclassified", parent_id: "", domain_id: "0"'
      why: >
        pages/3 does `df_domains["id"].astype(int)` — a non-numeric id raises and takes the whole
        page down. id "0" is int-castable and already falls through to the "Other" grey / white-square
        entries in lib/helpers (DOMAIN_COLORS["Other"], DOMAIN_EMOJI["Other"]).
      cross_stream_obligation: >
        STREAM C: lib/helpers.DOMAIN_ORDER is [1,2,3,4] and DOMAIN_COLORS/DOMAIN_EMOJI are keyed by
        id and name. Add 0 -> "Unclassified" (grey) and put 0 LAST in DOMAIN_ORDER, or the row is
        dropped from every domain chart without a word. all_topics carries no domain_id 0 row, so
        get_domain_id_to_name() cannot resolve it — the helpers constant is the fix, not the dictionary.
    columns:
      - {name: "level",             dtype: string,  from: "level", allowed: [domain, field, subfield, topic]}
      - {name: "id",                dtype: string,  from: "OpenAlex id of the entity",
         format: "domain/field/subfield: numeric string ('1', '11', '1100'); topic: 'T10001'"}
      - {name: "name",              dtype: string,  from: "entity"}
      - {name: "parent_id",         dtype: string,  from: "taxonomy", nullable: true, format: "'' for domain rows"}
      - {name: "parent_name",       dtype: string,  from: "taxonomy", nullable: true}
      - {name: "domain_id",         dtype: string,  from: "taxonomy"}
      - {name: "pubs_total",        dtype: int64,   from: "works"}
      - {name: "pubs_pct_of_ul",    dtype: float64, from: "works / corpus total"}
      - {name: "pubs_per_year",     dtype: string,  from: "ul_thematic_by_year", format: "2019:585|2020:627|..."}
      - {name: "pct_isite",         dtype: float64, from: "in_isite_works / works"}
      - {name: "pct_top10",         dtype: float64, from: "PPtop10_FR_share",
         d53_note: "computed over works_with_indicators only; null when the level has no computed works — never 0"}
      - {name: "pct_top1",          dtype: float64, from: "PPtop1_FR share", nullable: true}
      - {name: "pct_international", dtype: float64, from: "international_share"}
      - {name: "pct_company",       dtype: float64, from: "derived from corpus_authorships institution_type == company"}
      - {name: "pct_sdg",           dtype: float64, from: "sdg_three_way, column selected by app.sdg_variant"}
      - {name: "cagr_2019_2023",    dtype: float64, from: "derived from pubs_per_year", nullable: true,
         display_retired: "pass 6, P5/#18: CAGR->momentum swap. Column kept computing (frozen v1
           consumers may still read it), but DISPLAY-RETIRED app-wide -- hidden-by-default on every
           page, superseded by the mom_* family below as THE dynamics indicator."}
      - {name: "mom_class",         dtype: string,  nullable: true, allowed: [up, down, stable, ns],
         new_in_v2: true,
         why: "pass 6, P5/#18: the SAME frozen recentred-ratio + two-proportion-test momentum family
           every partner-grain table already carries (pipeline/lib46_momentum.py), applied to this
           taxonomy node via a shared field-level d1/d2/med reference (computed once, reused at
           every level -- lib46_momentum.corpus_level_reference()/cell_delta()). NULL when the node
           does not clear the frozen method's own eligibility gate (inwin>=20, both windows
           populated)."}
      - {name: "mom_p_value",       dtype: float64, nullable: true, new_in_v2: true}
