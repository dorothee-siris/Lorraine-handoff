      - {name: "fwci_mean",          dtype: float64, from: "FWCI_FR mean", nullable: true}
      - {name: "cagr_2019_2023",     dtype: float64, from: "derived from pubs_per_year", nullable: true,
         display_retired: "pass 6, P5/#18 -- see thematic_overview.cagr_2019_2023, same swap, same
           mom_* replacement family below"}
      - {name: "mom_class",          dtype: string, nullable: true, allowed: [up, down, stable, ns],
         new_in_v2: true,
         why: "pass 6, P5/#18 -- SAME construction as thematic_overview's mom_class (identical
           field-level d1/d2/med reference, recomputed in this separate script, deterministic)"}
      - {name: "mom_p_value",        dtype: float64, nullable: true, new_in_v2: true}
