  sdg_three_way.parquet:
    source: "sdg_three_way.parquet"
    build_step: "pipeline/60_deploy.py (verbatim copy)"
    keys: [work_id]
    read_by_app: true
    read_by: ["pages/3_*.py SDG panel (NEW, D51); pct_sdg on the thematic tables"]
    rows_expected: 21505
    new_in_v2: true
    why_deployed: >
      D51/D4/R8 - the SDG variant is a CONFIG SWITCH, never a rebuild. One file with three columns
      makes the switch a column selection: app.sdg_variant b_siris -> B_siris, c_openalex ->
      C_openalex, off -> hide the panel. A_v1 is kept because the shift report quotes it (96.5%
      identical SDG sets vs v1, Jaccard 0.983).
    columns:
      - {name: "work_id",     dtype: string, from: "work_id"}
      - {name: "A_v1",        dtype: string, from: "A_v1", nullable: true, format: "SPACE-separated SDG ids ('1 8'), null when untagged"}
      - {name: "B_siris",     dtype: string, from: "B_siris", nullable: true, format: "SPACE-separated SDG ids ('12 15'), null when untagged"}
      - {name: "C_openalex",  dtype: string, from: "C_openalex", nullable: true, format: "SPACE-separated SDG ids, null when untagged"}
    contract_correction: >
      STREAM B CORRECTION (found by Stream C, flagged per BUILD_PLAN instructions): the multi-goal
      columns are SPACE-separated ("12 15"), never '|'-separated as this section previously
      declared. Verified 2026-08-11 directly against sdg_three_way.parquet: 0 of 5,447 non-null
      B_siris values contain '|'; 1,541 contain a space (a multi-goal assignment). Splitting on '|'
      instead of whitespace silently treats every multi-goal string as one unsplit token, which
      undercounts individual SDG ASSIGNMENTS (though it does not affect a simple `.notna()` count
      of TAGGED WORKS, which is all Stream B's own builders ever do with this column). Checked:
      no Stream B builder or test in this contract's fence splits sdg_three_way on '|' or on
      anything else; every read is a plain notna()/column-selection. Stream F's shift-report code
      (`pipeline/70_shift_report.py`, `pipeline/80_audit.py`) is outside Stream B's fence and was
      not modified here -- flagged to the orchestrator to check separately.
    consumer_constraint: >
      A work absent from this file, or null in the active variant's column, is UNTAGGED - it is not
      "0 SDGs" for a mean and it is not evidence of no SDG relevance (14.8% coverage is a keyword
      method's floor, not a finding). Aggregates must state the denominator.
    dropped_from_v1: []

