    read_by_app: true  # pages land this pass (not yet built as of this Assembly Line pass)
    read_by: ["V2 portage panel (I7) -- drilldown-only, NEVER a league column (plan sec.3)"]
    rows_expected: 65712    # CORRECTED pass 6 (manager re-open, P-ZP finding, progress/PZP.md):
                            # was 83184, which included 13,645 blob-separator FRAGMENT rows (16.4%
                            # of the table) -- see blob_separator_fix note below.
    new_in_v2: true
    row_grain: "partner x lab x conf_state, sparse (only (partner,lab) pairs with >=1 co-work; a
      work touching multiple labs contributes to EACH lab's row -- multi-attribution, by design,
      per docs/indicator_plan_FINAL.md I7 (works-based, NO-LAB disclosed, never a league column)"
    why_deployed: "I7 works-based lab attribution, NO-LAB share disclosed rather than hidden."
    blob_separator_fix: >
      Pass 6 (manager re-open, P-ZP finding on partner I4210100260/CHRU Nancy, progress/PZP.md):
      pipeline/46_build_partner_views.py::build_ptn_labs() called `Labs.str.split(" | ")` WITHOUT
      `regex=False`. pandas treats a >1-char split pattern as a REGEX by default, and " | " as a
      regex is ALTERNATION (the middle '|' is the regex operator, not a literal pipe) -- it
      silently split on every SPACE character instead of the literal 3-char separator. Any lab
      name containing a space ("INSPIIRE (Ex APEMAC)", "L2A (ex URAFPA)", "CIC PD", ...) shattered
      into fragments ("(Ex", "APEMAC)") plus a spurious literal "|" row wherever a work listed >1
      lab. Fixed by adding `regex=False` (the same fix `43_build_labs.py`'s own explode already
      applied correctly, and `43c_build_lab_tops.py`'s `lab_masks()` already applied correctly --
      this was the one remaining unfixed call site). The IDENTICAL defect also lived in
      `scope_aggregates()`'s `n_labs()` helper (line ~593, feeding `ptn_summary.n_ul_labs`),
