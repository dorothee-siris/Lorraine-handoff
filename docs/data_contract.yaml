  thematic_detail_contributions.parquet:
    source: "works_master.parquet (Labs, Poles) + ul_labs.parquet"
    build_step: "pipeline/44d_build_detail_contributions.py"
    keys: [level, id]
    read_by_app: true
    read_by: ["pages/4_*.py:get_contribution_data"]
    row_grain: "one row per (level, entity)"
    levels_required: [domain, field, subfield]
    levels_optional: [topic]
    rows_expected_min: 271
    column_discovery: >
      page 4 finds these columns by SUBSTRING (find_column(row, "department_breakdown")), so v1's
      format-in-the-name suffixes ("top_labs 'ror:name:type:count:share|...'") are unnecessary.
      v2 uses clean names; page 4 needs no change. This is a rename, not a drop.
    columns:
      - {name: "level", dtype: string, from: "level"}
      - {name: "id",    dtype: string, from: "bare entity id, matches thematic_overview.id"}
      - name: "department_breakdown"
        dtype: string
        from: "works_master.Poles"
        from_v1: "department_breakdown 'dept:count:share|...'"
        format: "dept:count:share|... e.g. 'A2F:705:0.2284|BMS:601:0.1947'"
        naming_note: >
          The column keeps the v1 name and page 4 keeps the label "Contributing departments",
          but the values are UL *poles*. Verified identical value sets: v1's 10 department names
          == v2's 10 pole values (A2F, AM2I, BMS, CLCS, CPM, EMPP, LLECT, M4, OTELo, SJPEG).
          Multi-pole works carry ' | '-joined poles in works_master and must be counted once per
          distinct pole.
      - name: "top_labs"
        dtype: string
        from: "works_master.Labs joined to ul_labs (ror, type)"
        from_v1: "top_labs 'ror:name:type:count:share|...'"
        format: "ror:name:type:count:share|... e.g. '03c4rpa03:IAM:lab:289:0.0936'"
        hazard: >
          BLOB SEPARATOR HAZARD. 8 of the 21 D56 hors-liste structures contain ':' in their display
          name ("CAPSID: Computational Algorithms for Protein Structures and Interactions"). page 4
          splits each item on ':' into exactly 5 positional fields, so an unsanitised name shifts
          `type`, `count` and `pct` and the bar chart silently renders the wrong numbers. Sanitise
          per policy.blob_sanitise. Also, v1 emitted a pseudo-structure `ror_isite:ISITE:experimental`
          in this blob; v2 does not carry ISITE as a structure (In_ISITE is a per-work flag), so it
          must not reappear.
      - name: "department_breakdown_isite"
        dtype: string
        new_in_v2: true
        why: "OVERLAY_MATRIX EXTEND (pass 5, S3, additive, docs/OVERLAY_MATRIX.md): same-row ISITE
          twin of department_breakdown -- per department, the count/share of ITS OWN bar (not of
          the node total) that is In_ISITE, same darker-segment convention as ptn_summary's
          isite_co_works/isite_share. Zero recomputation at render time."
        format: "dept:isite_count:isite_share|... (3 ':'-fields, ltype not repeated) -- same
          department order as department_breakdown, every department present even at isite_count=0"
      - name: "top_labs_isite"
        dtype: string
        new_in_v2: true
        why: "same overlay rationale as department_breakdown_isite, applied to top_labs"
        format: "ror:name:isite_count:isite_share|... (4 ':'-fields) -- same lab order/identity as
          top_labs, every listed lab present even at isite_count=0"
        hazard: "same BLOB SEPARATOR HAZARD as top_labs, same policy.blob_sanitise guard"
    dropped_from_v1:
      - {name: "top_research_topics 'id:label:count:share|...'", reason: "D9 - topic model removed", pending_removal: true,
         stream_c_action: "delete the 'Top 10 contributing Research Topics' block (pages/4_*.py ~L516-550); the taxonomy equivalent is already in thematic_detail_sublevels"}
      - {name: "top_objectives 'id:label:count:share|...'", reason: "D9 - Objective axes removed, nothing replaces them"}
      - {name: "top_methods 'id:label:count:share|...'", reason: "D9 - Method axes removed, nothing replaces them"}
      - {name: "top_impacts 'id:label:count:share|...'", reason: "D9 - Impact axes removed, nothing replaces them"}

  thematic_detail_partners.parquet:
