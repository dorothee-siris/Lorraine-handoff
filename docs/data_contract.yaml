    rows_expected: 252
    new_in_v2: true
    row_grain: "one row per subfield_id in the FULL OpenAlex vocabulary (246 of 252 are used by
      the UL corpus) -- row count MUST equal the vocab count, asserted"
    why_deployed: "same #20 rationale as topics_zero_fill, one level up"
    columns:
      - {name: "subfield_id", dtype: string}
      - {name: "subfield_name", dtype: string}
      - {name: "field_id", dtype: string}
      - {name: "field_name", dtype: string}
      - {name: "domain_id", dtype: string}
      - {name: "domain_name", dtype: string}
      - {name: "pubs_total", dtype: int64}
      - {name: "pubs_pct_of_ul", dtype: float64}
      - {name: "pct_isite", dtype: float64, nullable: true}
      - {name: "pct_top10", dtype: float64, nullable: true}
      - {name: "pct_top1", dtype: float64, nullable: true}
      - {name: "pct_international", dtype: float64, nullable: true}
      - {name: "pct_company", dtype: float64, nullable: true}
      - {name: "pct_sdg", dtype: float64, nullable: true}
      - {name: "cagr_2019_2023", dtype: float64, nullable: true,
         display_retired: "pass 6, P5/#18 -- see thematic_overview.cagr_2019_2023"}
      - {name: "fwci_median", dtype: float64, nullable: true}
      - {name: "fwci_mean", dtype: float64, nullable: true}
      - {name: "fwci_boxplot", dtype: string, nullable: true}
      - {name: "mom_class", dtype: string, nullable: true, allowed: [up, down, stable, ns]}
      - {name: "mom_p_value", dtype: float64, nullable: true}
      - {name: "mom_w1_share", dtype: float64, nullable: true}
      - {name: "mom_w2_share", dtype: float64, nullable: true}
      - {name: "mom_eligible_flag", dtype: boolean, nullable: true}
      - {name: "has_corpus_works", dtype: bool}
      - {name: "snapshot_date", dtype: string}
    artifact_exempt_families: "momentum (mom_ prefix)"
    invariants:
      - "row count == 252 == all_topics.parquet's own distinct subfield_id count, EXACTLY"
      - "pubs_total>0 <=> has_corpus_works"
    dropped_from_v1: []

  # ==========================================================================================
  # 49. ptn_denominators -- pass 6, S-DAT (pipeline/46_build_partner_views.py), P4/#39/#40
  # ==========================================================================================
  ptn_denominators.parquet:
    source: "ptn_summary.parquet's own (conf_state='all', subset_id='all') rows +
             inputs/overlays/idset_consortium.csv"
    build_step: "pipeline/46_build_partner_views.py"
    keys: [partner_id]
    read_by_app: true
    read_by: ["pages/8_*.py (overview table progress-bar 'part partenaire' + France-hors-site
               share); pages/9_*.py (Zoom partenaire: country-share, intl-share, corpus-share)"]
    rows_expected: 12570
    new_in_v2: true
    row_grain: "one row per partner_id -- derived DIRECTLY from ptn_summary's own already-built
      (all,all) row, never a separate recompute, so numbers reconcile exactly on the same page"
    why_deployed: >
      P4 partner-metric definitions: reciprocity/share vocabulary extended with 3 NEW share
      families beyond ptn_summary's own share_ul/share_p: (1) this partner's share of UL's WHOLE
      corpus; (2) for FRANCE partners, share of UL's France copubs EXCLUDING the 8 consortium
      signatories (idset_consortium.csv) -- "what does this partner really weigh once the natural
      site candidates are removed"; (3) for INTERNATIONAL partners, share of UL's total
      international copubs AND share of UL's copubs with that partner's own COUNTRY (the
      "Groningen = 5% of NL collabs" example). All computed at $0 from local data.
    columns:
      - {name: "partner_id", dtype: string}
      - {name: "display_name", dtype: string}
      - {name: "country_code", dtype: string, nullable: true}
      - {name: "co_works_full", dtype: int64, from: "verbatim from ptn_summary (all,all) --
         reconciles exactly with the 'part partenaire' progress bar on the same page"}
      - {name: "is_consortium_member", dtype: boolean, from: "partner_id in
         inputs/overlays/idset_consortium.csv (15 ids / 8 signatories)"}
      - {name: "share_of_ul_corpus", dtype: float64, from: "co_works_full / len(works_master) --
         the 36,819-perimeter denominator, read live, never hardcoded"}
      - {name: "share_of_ul_france_copubs_hors_site", dtype: float64, nullable: true, from:
         "FRANCE partners only: co_works_full / (sum of co_works_full over FR partners EXCLUDING
         consortium signatories). NULL for non-FR partners AND for consortium signatories
         themselves (excluded from that population by definition, not merely under-denominated)"}
      - {name: "share_of_ul_intl_copubs", dtype: float64, nullable: true, from: "INTERNATIONAL
         (non-FR) partners only: co_works_full / (sum of co_works_full over all non-FR partners).
         NULL for FR partners"}
      - {name: "share_of_ul_country_copubs", dtype: float64, nullable: true, from: "INTERNATIONAL
         partners only: co_works_full / (sum of co_works_full over partners from THIS partner's
         own country_code). NULL for FR partners"}
      - {name: "snapshot_date", dtype: string}
    invariants:
      - "every share_of_ul_* column in [0,1] wherever non-null"
      - "consortium signatories carry a NULL share_of_ul_france_copubs_hors_site (excluded from
         that denominator by definition, asserted in the builder)"
      - "FR partners carry NULL share_of_ul_intl_copubs and share_of_ul_country_copubs;
         international partners carry NULL share_of_ul_france_copubs_hors_site"
      - "ONE hand-verified spot check: an independent pandas groupby-sum recompute of one
         partner's share_of_ul_country_copubs (the country with the most international partners)
         reproduces the table value EXACTLY -- asserted at build time"
    dropped_from_v1: []

