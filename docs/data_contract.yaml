    write_spec: "sorted by lab, row_group_size=5000 (Class-1 floor asserted in the builder)"
    why_deployed: "the lazy publication-list source for lab-scoped downloads app-wide -- callers
      slice by lab (server pushdown) then filter client-side (sdg_tags substring for an ODD
      selection, in_isite, indicator flags, year, ...), never loading a global works file resident
      (grill Q3 lazy rule)."
    columns:
      - {name: "lab", dtype: category}
      - {name: "work_id", dtype: string}
      - {name: "year", dtype: int32}
      - {name: "title", dtype: string}
      - {name: "doi", dtype: string, nullable: true}
      - {name: "type", dtype: category}
      - {name: "is_conference", dtype: bool}
      - {name: "fwci_fr", dtype: float64, nullable: true}
      - {name: "pptop10_fr", dtype: boolean, nullable: true}
      - {name: "pptop1_fr", dtype: boolean, nullable: true}
      - {name: "indicator_status", dtype: category, allowed: [computed, thin_stratum, no_stratum]}
      - {name: "in_isite", dtype: bool}
      - {name: "artifact_flag", dtype: bool, from: "lib.artifact.flag_works -- work-grain list
         table, per-row flag is the mechanism, no column twinning applies"}
      - {name: "sdg_tags", dtype: string, nullable: true, from: "pipe-joined SIRIS sdg numbers,
         same construction as ptn_works.sdg_tags"}
      - {name: "primary_field_id", dtype: category}
      - {name: "primary_subfield_id", dtype: category}
      - {name: "primary_topic_id", dtype: category}
      - {name: "snapshot_date", dtype: string}
    invariants:
      - "Class-1 row-group floor (num_row_groups >= n_rows/10000), asserted in the builder"
      - "sum over labs of per-lab row count >= corpus size (multi-attribution, by design)"
    dropped_from_v1: []

  # ==========================================================================================
  # 47. topics_zero_fill -- pass 6, S-DAT (pipeline/44h_build_zero_fill.py), #20
  # ==========================================================================================
  topics_zero_fill.parquet:
    source: "all_topics.parquet (full OpenAlex topic vocabulary, 4,516 topics) LEFT JOIN
             thematic_overview.parquet (level=topic rows)"
    build_step: "pipeline/44h_build_zero_fill.py"
    keys: [topic_id]
    read_by_app: true
    read_by: ["pages/4_*.py (topics table, #20 no-cap full-vocab display)"]
    rows_expected: 4516
    new_in_v2: true
    row_grain: "one row per topic_id in the FULL OpenAlex vocabulary (not just the 3,275 the UL
      corpus actually uses) -- row count MUST equal the vocab count, asserted"
    why_deployed: >
      #20: thematic_overview only carries a row for a topic the corpus USES, so a 'quantum' query
      could miss a real topic entirely if UL has zero works on it (2 of the corpus's 18 quantum-
      substring topics were exactly this case, measured). This table zero-fills the volume columns
      and leaves rate/stat columns NULL (D53) for every topic outside the corpus.
    columns:
      - {name: "topic_id", dtype: string}
      - {name: "topic_name", dtype: string}
      - {name: "subfield_id", dtype: string}
      - {name: "subfield_name", dtype: string}
      - {name: "field_id", dtype: string}
      - {name: "field_name", dtype: string}
      - {name: "domain_id", dtype: string}
      - {name: "domain_name", dtype: string}
      - {name: "pubs_total", dtype: int64, from: "0 when the topic has no UL work -- a count of 0
         IS well-defined, never NULL"}
      - {name: "pubs_pct_of_ul", dtype: float64, from: "0.0 when pubs_total is 0 -- 0/corpus IS 0,
         well-defined"}
      - {name: "pct_isite", dtype: float64, nullable: true, from: "NULL when pubs_total is 0 (D53:
         a ratio over zero works is unknown, never a fabricated 0), else thematic_overview's value"}
      - {name: "pct_top10", dtype: float64, nullable: true}
      - {name: "pct_top1", dtype: float64, nullable: true}
      - {name: "pct_international", dtype: float64, nullable: true}
      - {name: "pct_company", dtype: float64, nullable: true}
      - {name: "pct_sdg", dtype: float64, nullable: true}
      - {name: "cagr_2019_2023", dtype: float64, nullable: true,
         display_retired: "pass 6, P5/#18 -- see thematic_overview.cagr_2019_2023"}
      - {name: "fwci_median", dtype: float64, nullable: true}
      - {name: "fwci_mean", dtype: float64, nullable: true}
      - {name: "fwci_boxplot", dtype: string, nullable: true}
      - {name: "mom_class", dtype: string, nullable: true, allowed: [up, down, stable, ns]}
      - {name: "mom_p_value", dtype: float64, nullable: true}
      - {name: "mom_w1_share", dtype: float64, nullable: true}
      - {name: "mom_w2_share", dtype: float64, nullable: true}
      - {name: "mom_eligible_flag", dtype: boolean, nullable: true, from: "NULL (not False) on a
         zero-work topic -- there is no eligibility question to answer at all, distinct from
         thematic_overview's own False-never-NULL convention for topics it actually carries"}
      - {name: "has_corpus_works", dtype: bool, from: "pubs_total > 0 -- convenience flag"}
      - {name: "snapshot_date", dtype: string}
    artifact_exempt_families: "momentum (mom_ prefix)"
    invariants:
      - "row count == 4,516 == all_topics.parquet's own distinct topic_id count, EXACTLY"
      - "a 'quantum' (case-insensitive) substring query against topic_name returns EVERY matching
         topic, including has_corpus_works==False rows (the #20 acceptance example, asserted at
         build time: 18 matches, 2 at zero UL works, both present)"
      - "pubs_total>0 <=> has_corpus_works"
    dropped_from_v1: []

  # ==========================================================================================
  # 48. subfields_zero_fill -- pass 6, S-DAT (pipeline/44h_build_zero_fill.py), #20
  # ==========================================================================================
  subfields_zero_fill.parquet:
    source: "all_topics.parquet (full OpenAlex subfield vocabulary, 252 subfields) LEFT JOIN
             thematic_overview.parquet (level=subfield rows)"
    build_step: "pipeline/44h_build_zero_fill.py"
    keys: [subfield_id]
