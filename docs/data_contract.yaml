# ==============================================================================================
# Invariants the contract asserts (tests/test_contract_tables.py, Stream B)
# ==============================================================================================
invariants:
  - id: pk_unique
    class: 1
    check: "for every file, `keys` is unique and non-null"
  - id: fk_resolves
    class: 1
    check: "every work_id in a deployed file exists in ul_pubs.parquet; every taxonomy id exists in all_topics.parquet"
  - id: dtypes_match
    class: 1
    check: "every declared column exists with the declared dtype; nullable:false columns have no nulls"
  - id: taxonomy_is_superset
    class: 1
    check: >
      every (domain_id, field_id, subfield_id) and every primary_topic_id observed in works_master
      exists in all_topics.parquet. Fails when OpenAlex bumps the taxonomy version and the frozen
      dictionary must be refreshed. Measured 2026-08-11: holds (0 unknown ids).
  - id: subfield_blob_length
    class: 1
    check: >
      for every column matching a per-subfield family, the number of pipe-separated values equals
      len(sorted(all_topics.subfield_id where field_id == N)). This is the positional-misalignment
      guard - the defect class that hit v1 on 51.4% of works.
  - id: blob_separator_safety
    class: 1
    check: >
      no field value inside any ':'/'|' blob column contains ':' or '|'. Seed the test with
      "CAPSID: Computational Algorithms for Protein Structures and Interactions" (a D56 hors-liste
      structure) - unsanitised, it shifts every field of that item and page 4 renders wrong numbers
      without raising.
  - id: no_lab_unchanged
    class: 1
    check: "ul_labs row where Structure name == 'NO LAB' has Pubs total == 4568 (D56 explicitly does not move it)"
    v1_note: "v1's deployed NO LAB row carried Pubs total = 0 while its own top_labs blobs credited NO LAB with hundreds of works - a v1 inconsistency v2 fixes."
  - id: hors_liste_rows
    class: 1
    check: "ul_labs has exactly 21 rows with in_client_list == false, and their Pubs total match ul_descendants.corpus_works (690, 421, 111, 27, 22, 18, 12 and 14 zeros)"
  - id: indicator_status_never_zero
    class: 1
    check: "no deployed aggregate computes an indicator over works whose indicator_status != 'computed' (D53)"
  - id: is_abstract_present
    class: 1
    check: "ul_pubs.parquet has an Is_abstract column (the v1 regression test)"
  - id: file_set_exact
    class: 1
    check: "Streamlit/data/ contains exactly the files in `files` (len(contract['files']), computed
      dynamically -- never hand-copy this count) and no TM_labels.parquet. Pass 6, S-DAT: 47 -> 55
      (8 new tables: sdg_lab_methods, lab_top_partners, lab_top_authors, lab_wordcloud, lab_works,
      topics_zero_fill, subfields_zero_fill, ptn_denominators)"

# ==============================================================================================
# Config keys the app reads (Stream C reads these from config.yaml, not from this contract)
# ==============================================================================================
app_config_keys:
  app.sdg_variant:
    allowed: [b_siris, c_openalex, off]
    default: b_siris
    reads: "sdg_three_way.B_siris | sdg_three_way.C_openalex | panel hidden"
    why: "D51 - the client chooses at the workshop; a config switch, never a rebuild (D4/R8)"
  app.include_conference:
    allowed: [true, false]
    default: true
    reads: "ul_pubs.is_conference"
    why: "D52 - prominent sidebar toggle on every page that counts works"
  app.show_hors_liste:
    allowed: [true, false]
    default: false
    reads: "ul_labs.in_client_list"
    why: "D56 - hors-liste structures are selectable and flagged, but excluded from aggregates and rankings by default"
