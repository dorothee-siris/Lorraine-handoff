        dtype: string
        from_v1: "top_int_partners (id:name:country:type:copubs:share_ul:share_int:share_partner:fwci)"
        format: "9 fields per item: id:name:country:type:copubs:share_ul:share_int:share_partner:fwci"
        items: 20
        field_semantics:
          share_ul: "co-pubs / UL's works at this level"
          share_int: "co-pubs / ALL UL co-pubs with this partner (ul_partners.co_works)"
          share_partner: "co-pubs / the PARTNER's own works at this level - needs ul_partners_base"
          fwci: "mean FWCI_FR of the co-pubs"
      - name: "top_fr_partners"
        dtype: string
        from_v1: "top_fr_partners (id:name:type:copubs:share_level:share_int:share_partner:fwci)"
        format: "8 fields per item (no country): id:name:type:copubs:share_ul:share_int:share_partner:fwci"
        items: 20
      - name: "reciprocity_partners"
        dtype: string
        from_v1: "reciprocity_partners (id:name:country:type:copubs:share_ul:share_int:share_partner:partner_total:fwci)"
        format: "10 fields per item, ending :share_partner:partner_total:fwci"
        items: 50
    hazard: >
      Same ':'-in-name hazard as top_labs, and worse here: partner display names routinely contain
      colons and commas ("Institut National de Recherche pour l'Agriculture, l'Alimentation et
      l'Environnement" is safe, but healthcare and consortium names are not). page 4 requires
      len(parts) >= n_fields and silently DROPS any item with too few — so an unsanitised colon
      does not raise, it just corrupts a row. Sanitise per policy.blob_sanitise.
    dependency_risk: >
      `share_partner` and `partner_total` cannot be computed from snapshot 2026-08-11. They need each
      partner's OWN output at each taxonomy level, which is external to the UL corpus. See
      ul_partners_base.parquet below and DATA_CONTRACT.md "Open risk 1".
      Degradation contract: if ul_partners_base ships without partner totals, emit share_partner and
      partner_total as the literal string "" so page 4's safe_float() yields NaN, the two affected
      table columns render "—", and section 7 (reciprocity) must be hidden by Stream C with an
      explicit empty state. NEVER emit 0 for an unknown denominator (D53).
    dropped_from_v1: []

