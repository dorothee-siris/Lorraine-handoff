    row_grain: "one row per (parent, child) edge of the taxonomy, restricted to parents with works"
    parent_levels_required: [domain, field, subfield]
    rows_expected_approx: 3548    # 27 field-children + 246 subfield-children + 3275 topic-children (id-keyed, see thematic_overview.contract_correction)
    columns:
