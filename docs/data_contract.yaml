  # ==========================================================================================
  # 4. treemap_hierarchy — page 3 section 1 (MISSING in v2, builder needed)
  # ==========================================================================================
  treemap_hierarchy.parquet:
    source: "thematic_overview.parquet (deployed shape) — a straight pivot"
    build_step: "pipeline/44b_build_treemap.py"
    keys: [id]
    read_by_app: true
    read_by: ["pages/3_*.py:load_treemap_hierarchy"]
    rows_expected: 3546
    row_grain: "one row per taxonomy node"
    levels: [domain, field, subfield, topic]
    id_scheme:
      required: 'domain "d_<id>", field "f_<id>", subfield "sf_<id>", topic "t_<topic_id>"'
      why: >
        Verified from v1's deployed file (d_1 / f_11 / sf_1100 / t_T12033). The prefixes are NOT
        cosmetic: plotly's treemap resolves `parents` against `ids` in one flat namespace, so bare
        numeric ids would collide across levels. Domain rows carry parent_id = "" (empty string,
        not null) — px.treemap treats null as a missing parent and drops the branch.
      unclassified: 'the "(sans thematique)" node is "d_0" with parent_id ""'
    columns:
      - {name: "id",                dtype: string,  from: "prefixed level id"}
      - {name: "name",              dtype: string,  from: "thematic_overview.name"}
      - {name: "parent_id",         dtype: string,  from: "prefixed parent id", format: "'' for domain rows"}
      - {name: "level",             dtype: string,  from: "thematic_overview.level"}
      - {name: "pubs",              dtype: int64,   from: "thematic_overview.pubs_total"}
      - {name: "fwci_median",       dtype: float64, from: "thematic_overview.fwci_median", nullable: true}
      - {name: "pct_top10",         dtype: float64, from: "thematic_overview.pct_top10", nullable: true}
      - {name: "pct_international", dtype: float64, from: "thematic_overview.pct_international", nullable: true}
      - {name: "pct_isite",         dtype: float64, from: "thematic_overview.pct_isite", nullable: true}
    consumer_constraint: >
      page 3 sets branchvalues="total", so a parent's `pubs` must be >= the sum of its children's.
      Because a work has exactly one primary topic, sums are exact; the builder must not mix a
      primary-topic parent count with an all-topics child count. page 3 also does
      np.stack([...pct_top10 * 100...]) over EVERY row it keeps — a null there yields nan in the
      hovertemplate, not an exception, which is exactly what must happen: pct_top10 is a D53
      INDICATOR (null on a thin/no stratum) and must stay null, never 0.0-filled for display.
    contract_correction: >
      STREAM B CORRECTION (found by Stream C, progress/C_app.md concern #2): this section
      previously said a null pct_top10 "should be 0-filled for display", which 44b_build_treemap.py
      followed literally -- a direct D53 violation (a real "we do not know" rendered as a measured
      0%). Corrected 2026-08-11: pct_top10 stays null; page 3's NaN-tolerant hovertemplate is the
      intended handling, not a builder-side 0-fill. Same fix note: the same section's rows
      previously duplicated the untopiced-works bucket FOUR times (one Unclassified root per level,
      d_0/f_0/sf_0/t_0, all parentless) instead of once -- fixed to keep exactly the domain-level
      d_0 node.
    dropped_from_v1: []

